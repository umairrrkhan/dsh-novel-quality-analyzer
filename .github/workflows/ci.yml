name: Plugin checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.2', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify committed browser bundle matches its source
        run: git diff --exit-code -- client.js
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: package-node-${{ matrix.node }}
          path: '*.tgz'
